<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title description">
  <title id="title">How Daleel answers a question</title>
  <desc id="description">Built once: nine PDFs pass a quality gate that sends each page to its text layer or to OCR, the calendar is rebuilt from its layout, and a chunker cuts 768 chunks, indexed for BM25 and as bge-m3 vectors. For each question: retrieval fuses BM25 and bge-m3 and reranks the first 20; a question whose best score is below -4.0 is refused; otherwise gemini-3.5-flash-lite answers from five numbered sources, and an answer that cites only those sources is returned. An answer that declines or cites wrongly is asked again once with ten sources; then a decline stands and anything else is refused.</desc>
  <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#656c76"/></marker></defs>
  <rect x="10" y="10" width="1080" height="300" rx="16" fill="#151b23" stroke="#3d444d"/>
  <text x="34" y="40" font-size="12" fill="#4493f8" font-weight="700" letter-spacing="1.2">BUILT ONCE, OFFLINE</text>
  <text x="1066" y="40" font-size="12" fill="#9198a1" text-anchor="end">a GPU for OCR and the vectors</text>
  <rect x="30" y="119" width="130" height="112" rx="12" fill="#212830" stroke="#3d444d" stroke-width="1"/>
