  <text x="975.0" y="185" font-size="15" fill="#f0f6fc" font-weight="600" text-anchor="middle">768 chunks</text>
  <text x="975.0" y="206" font-size="13" fill="#9198a1" text-anchor="middle">a BM25 index and</text>
  <text x="975.0" y="222" font-size="13" fill="#9198a1" text-anchor="middle">bge-m3 vectors</text>
  <path d="M160 175 H200" fill="none" stroke="#656c76" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/>
  <path d="M360 175 H390 V90 H430" fill="none" stroke="#656c76" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#head)"/>
