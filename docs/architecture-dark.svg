  <text x="480" y="104" font-size="12" fill="#9198a1">pypdfium2, 177 pages</text>
  <rect x="430" y="146" width="200" height="58" rx="12" fill="#212830" stroke="#3d444d"/>
  <path transform="translate(444 163) scale(1)" d="M4 8V6a2 2 0 0 1 2-2h2 M16 4h2a2 2 0 0 1 2 2v2 M20 16v2a2 2 0 0 1-2 2h-2 M8 20H6a2 2 0 0 1-2-2v-2 M7 12h10" fill="none" stroke="#4493f8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="172" font-size="14" fill="#f0f6fc" font-weight="600">OCR</text>
