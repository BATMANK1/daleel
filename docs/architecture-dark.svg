  <text x="846.0" y="511" font-size="13" fill="#9198a1" text-anchor="middle">cites only the</text>
  <text x="846.0" y="527" font-size="13" fill="#9198a1" text-anchor="middle">sources it got?</text>
  <rect x="945" y="424" width="130" height="112" rx="12" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
  <path transform="translate(996.0 438) scale(1.16667)" d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.4A8 8 0 1 1 21 12z M9 12l2 2l4-4" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
