  <text x="410" y="84" font-size="12" fill="#9198a1" text-anchor="middle" stroke="#151b23" stroke-width="4" paint-order="stroke" stroke-linejoin="round">yes</text>
  <text x="410" y="169" font-size="12" fill="#9198a1" text-anchor="middle" stroke="#151b23" stroke-width="4" paint-order="stroke" stroke-linejoin="round">no</text>
  <text x="262" y="254" font-size="12" fill="#9198a1" text-anchor="middle" stroke="#151b23" stroke-width="4" paint-order="stroke" stroke-linejoin="round">the calendar's PDF</text>
  <rect x="10" y="350" width="1080" height="330" rx="16" fill="#151b23" stroke="#3d444d"/>
  <text x="34" y="380" font-size="12" fill="#ab7df8" font-weight="700" letter-spacing="1.2">PER QUESTION</text>
  <text x="1066" y="380" font-size="12" fill="#9198a1" text-anchor="end">daleel serve, with the Gemini API</text>
