  <text x="95.0" y="185" font-size="15" fill="#f0f6fc" font-weight="600" text-anchor="middle">9 PDFs</text>
  <text x="95.0" y="206" font-size="13" fill="#9198a1" text-anchor="middle">257 pages</text>
  <rect x="200" y="119" width="160" height="112" rx="12" fill="#212830" stroke="#3d444d" stroke-width="1"/>
  <path transform="translate(266.0 133) scale(1.16667)" d="M12 3l7 3v5c0 4.5-3 8-7 10c-4-2-7-5.5-7-10V6z M9 12l2 2l4-4" fill="none" stroke="#4493f8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="280.0" y="185" font-size="15" fill="#f0f6fc" font-weight="600" text-anchor="middle">Quality gate</text>
  <text x="280.0" y="206" font-size="13" fill="#9198a1" text-anchor="middle">is each page's</text>
  <text x="280.0" y="222" font-size="13" fill="#9198a1" text-anchor="middle">text layer sound?</text>
