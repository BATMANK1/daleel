  <path transform="translate(71.0 438) scale(1.16667)" d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.4A8 8 0 1 1 21 12z M10 9.6a2 2 0 1 1 3 1.7c-.6.4-1 .8-1 1.5 M12 15.6v.1" fill="none" stroke="#ab7df8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
