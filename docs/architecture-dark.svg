  <text x="755.0" y="222" font-size="13" fill="#9198a1" text-anchor="middle">table row a sentence</text>
  <rect x="880" y="119" width="190" height="112" rx="12" fill="#212830" stroke="#3d444d" stroke-width="1"/>
