[project]
name = "daleel"
version = "0.1.0"
description = "Arabic regulations Q&A over RCJY college documents, with cited answers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pdfplumber>=0.11",
  "pillow>=10",
  "pypdfium2>=5",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "pre-commit",
]
# The PaddleOCR engine, pinned: its results are only comparable at one version.
# PaddlePaddle stays at 3.2.2 because 3.3.0 and 3.3.1 break MKL-DNN, the
# default CPU path (github.com/PaddlePaddle/Paddle/issues/77340).
paddle = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.2.2",
]

[project.scripts]
daleel = "daleel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daleel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
