[project]
name = "daleel"
version = "0.1.0"
description = "Arabic regulations Q&A over RCJY college documents, with cited answers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "pre-commit",
]

[project.scripts]
daleel = "daleel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daleel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
