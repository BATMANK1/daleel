[project]
name = "daleel"
version = "0.1.0"
description = "Arabic regulations Q&A over RCJY college documents, with cited answers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pdfplumber>=0.11",
  "numpy>=2",
  "pillow>=10",
  # 5.13.0 ships PDFium 153.0.7999.0, which puts the words of an Arabic line
  # last word first. 5.12.1 keeps them in order, and reads all 257 pages of the
  # corpus as 5.6.0 and 5.7.1 do (eval/results/gate_calibration.md).
  "pypdfium2>=5,<5.13",
  "langgraph>=1.2.14,<2",
  # Umm al-Qura dates, for the weeks of the calendar (daleel.answer.today).
  "hijridate>=2.6",
  # The web service (daleel serve).
  "fastapi>=0.143",
  "uvicorn>=0.54",
  "prometheus-client>=0.26",
]

[project.optional-dependencies]
dev = [
  "pytest",
  # FastAPI's test client sends its requests with httpx.
  "httpx>=0.28",
  "ruff",
  "pre-commit",
]
# The dense encoders and the reranker, pinned so their vectors and scores can be
# compared across runs. PyTorch comes with them; on a GPU, install the build
# for your CUDA first, as https://pytorch.org shows.
dense = [
  "sentence-transformers==6.1.0",
  "transformers==5.19.0",
]
# The PaddleOCR engine, pinned: its results are only comparable at one version.
# PaddlePaddle stays at 3.2.2 because 3.3.0 and 3.3.1 break MKL-DNN, the
# default CPU path (github.com/PaddlePaddle/Paddle/issues/77340).
paddle = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.2.2",
]

[project.scripts]
daleel = "daleel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daleel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
