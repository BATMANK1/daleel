name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege
permissions:
  contents: read

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # Each leg reports independently, so a 3.13-only failure is visible
      # as exactly that rather than cancelling the 3.12 run.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Create environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Pre-commit hooks
        # The same hooks at the same pinned versions as run locally. Calling
        # ruff directly here would let CI's ruff drift from the pre-commit
        # ruff, so a check could pass in one place and fail in the other.
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        # No corpus here: the PDFs are not redistributable. The suite runs
        # without them because analyse_text is a pure function over a string.
        run: pytest

  image:
    name: Docker image (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        # The CPU build: the GPU build differs only in PyTorch's index, and
        # GitHub's runners have no GPU to try it on.
        run: docker build --tag daleel:ci .

      - name: Check the installed service
        # No data or models here: the image's code, its page and fonts, and the
        # command it starts with, are what can be checked without them.
        run: |
          docker run --rm daleel:ci python -c "
          import torch, sentence_transformers
          from daleel.serve.app import PAGE
          assert PAGE.is_file() and len(list((PAGE.parent / 'fonts').glob('*.woff2'))) == 8
          print('torch', torch.__version__, 'sentence-transformers', sentence_transformers.__version__)
          "
          docker run --rm daleel:ci daleel serve --help

      - name: Check the compose files
        run: |
          GEMINI_API_KEY=unused docker compose --profile gpu --profile cpu config --quiet
          GEMINI_API_KEY=unused DALEEL_ACCESS_CODE=unused-in-ci-0000 \
            docker compose -f compose.yaml -f compose.pilot.yaml --profile gpu --profile cpu \
            config --quiet
